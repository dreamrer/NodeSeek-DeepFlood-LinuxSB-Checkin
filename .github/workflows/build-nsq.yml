name: 打包 nsq 二进制

# 只手动触发，不影响签到 workflow
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    # 在 Debian 11(glibc 2.31)容器里打包，兼容绝大多数在用的 Linux 服务器
    # （Debian 11+/Ubuntu 20.04+/CentOS 8+ 都是 glibc >= 2.28）
    container: python:3.11-bullseye
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi pyinstaller

      - name: Build binary
        working-directory: ns-server
        run: |
          pyinstaller --onefile --name nsq nsq.py
          mv dist/nsq dist/nsq-linux-${{ matrix.arch }}
          ls -l dist
          echo "=== glibc 版本 ==="
          ldd --version | head -1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nsq-linux-${{ matrix.arch }}
          path: ns-server/dist/nsq-linux-${{ matrix.arch }}
          if-no-files-found: error
