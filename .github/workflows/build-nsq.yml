name: 打包 nsq 二进制

# 只手动触发，不影响签到 workflow
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi pyinstaller

      - name: Build binary
        working-directory: ns-server
        run: |
          pyinstaller --onefile --name nsq nsq.py
          mv dist/nsq dist/nsq-linux-${{ matrix.arch }}
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nsq-linux-${{ matrix.arch }}
          path: ns-server/dist/nsq-linux-${{ matrix.arch }}
          if-no-files-found: error
